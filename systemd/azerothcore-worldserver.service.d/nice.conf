# Optional drop-in: let worldserver raise its own scheduling priority, which
# silences the "Can't set process priority class" warning. CAP_SYS_NICE is the
# single narrow capability needed. Install as:
#   /etc/systemd/system/azerothcore-worldserver.service.d/nice.conf
[Service]
AmbientCapabilities=CAP_SYS_NICE
