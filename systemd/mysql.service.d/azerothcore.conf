# Drop-in on mysql.service: bring the realm back whenever MySQL starts.
#
# The realm units declare Requires=mysql.service, which propagates a stop but not
# a start -- so after a MySQL restart (an Ubuntu security update, typically) the
# realm shuts down cleanly and never returns, with no error in the journal.
# Wants= supplies the missing half. A drop-in leaves Ubuntu's own mysql.service
# untouched, so a package upgrade cannot undo it. Install as:
#   /etc/systemd/system/mysql.service.d/azerothcore.conf
[Unit]
Wants=azerothcore-authserver.service azerothcore-worldserver.service
